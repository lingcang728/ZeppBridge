<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 原生深浅主题由 ZeppBridge 管理；阻止 Dark Reader 再次改色（演示 iframe 也共用此入口）。 -->
    <meta name="darkreader-lock" />
    <!-- 首帧禁止浏览器自动变暗；加载后由主题 CSS 指定 only light / only dark。 -->
    <meta name="color-scheme" content="only light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme-color 由 useTheme 按当前生效主题重写；这里放深色默认值兜底。 -->
    <meta name="theme-color" content="#0D0F12" />
    <meta name="description" content="ZeppBridge 是本地优先、开源的 Amazfit/Zepp 穿戴数据桥接与可视化工具。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ZeppBridge · Your Zepp data, handed back in full" />
    <meta property="og:description" content="Connect, organize and visualize Amazfit wearable data on your own Windows, Mac or Linux machine. Sources stay intact, and nothing leaves until you send it." />
    <meta property="og:image" content="/zeppbridge-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>ZeppBridge · Local Data Bridge</title>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

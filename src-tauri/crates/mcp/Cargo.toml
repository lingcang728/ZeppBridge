[package]
name = "zeppbridge-mcp"
version = "3.1.1"
description = "ZeppBridge MCP 服务：stdio、不监听任何端口；写入都能在应用里撤销"
edition = "2021"

[features]
default = []
store = ["zeppbridge-core/store"]

[[bin]]
name = "zeppbridge-mcp"
path = "src/main.rs"

[dependencies]
zeppbridge-core = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# 测试夹具需要直接写 `ai_tasks` 行——这张表是 S1 v32 的迁移，core 的
# pub(crate) conn 到不了这里，所以测试自己开一条连接建最小形态。
rusqlite = { workspace = true }

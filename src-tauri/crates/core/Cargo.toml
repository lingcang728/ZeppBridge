[package]
name = "zeppbridge-core"
version = "2.0.0"
description = "ZeppBridge 的共享数据核心：模型、存储、迁移、归一化、查询、导出与写入协调"
edition = "2021"

[lib]
name = "zeppbridge_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
flate2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux 上的凭据存储走 Secret Service（GNOME Keyring / KWallet）。
#
# 选 `sync-secret-service` 而不是 `async-secret-service`：`CredentialBackend`
# 的三个方法都是同步的，而调用它们的 Tauri 命令跑在 tokio 上。异步那条路会在
# 内部 `block_on`，从 tokio 的工作线程上调进去可能把运行时卡住。同步这条走
# libdbus，一个阻塞的 C 库，没有第二个执行器可卡。
#
# 代价是一个系统库：构建要 `libdbus-1-dev`，运行要 `libdbus-1-3`。
# 见 docs/guides/linux.md。
#
# 不用 `linux-native`（keyutils）——那个存储活不过一次重启，而「重启之后要
# 重新配对一次」会被当成 bug 报上来。
#
# `crypto-rust` 而不是 `crypto-openssl`：会话加密用纯 Rust 实现，不再多引入
# 一个 OpenSSL 的系统库依赖。
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = [
  "sync-secret-service",
  "crypto-rust",
] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

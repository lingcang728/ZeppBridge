name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 构建标记里的短 SHA。
  #
  # vite.config.ts 优先读它，读不到才退回 `git rev-parse`。而 `git rev-parse`
  # 在两种真实情况下会安静地变成 "unknown"：构建沙箱里没有 .git，以及从
  # 压缩包构建。设置页上那一行是「同一个版本号构建了很多次，你手上是哪一
  # 个」的唯一答案——它一旦变成 unknown，一份「我还是看到旧行为」的报告就
  # 没法定位到具体构建。
  #
  # 放在 workflow 层：每一个跑 `npm run build` 或 `tauri build` 的作业都要
  # 它，一处漏掉的代价是那个渠道的产物无法追溯，而 CI 是绿的。
  ZEPPBRIDGE_BUILD_SHA: ${{ github.sha }}

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # 版本号散落在七个文件里，少改一处不会报错，只会由用户在发版后发现。
      - name: Check version consistency
        run: npm run version:check

      # 坏掉的相对链接不会让任何构建失败，只会让读者点进 404。
      - name: Check documentation links
        run: npm run docs:check

      # 首屏体积预算。挡的是「一次提交多出几百 kB」这种没人会主动去量的回归。
      - name: Check bundle budget
        run: npm run budget:check

      # 硬编码的中文。翻译是一次性的，硬编码是持续发生的：写下一个组件时顺手
      # 打一句中文，构建不会红，只有一个看不懂中文的用户会看到它——而他没法
      # 告诉我们。所以让 CI 来管。
      - name: Check for hardcoded Chinese in the UI
        run: npm run i18n:check

      - name: Test frontend
        run: npm test

      - name: Test Pages functions
        run: npm run test:functions

      - name: Verify icon consistency
        run: |
          python -m pip install --upgrade pillow
          npm run icons:verify

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --locked --all-targets

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --locked --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked --jobs 1

  verify-linux:
    name: Linux verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      # Tauri 在 Linux 上的构建依赖。libdbus-1-dev 是这个项目额外要的一样：
      # Linux 的凭据存储走 Secret Service，那条路链接 libdbus。
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libxdo-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      # tauri-build resolves frontendDist (../dist) at compile time, so the
      # frontend must exist before any cargo command runs.
      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --locked --all-targets

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --locked --all-targets -- -D warnings

      # Linux 上跑一遍 Rust 测试，才能真的覆盖到只在这个平台编译的代码：
      # 凭据存储的三个后端和数据目录的 XDG 回退都是 cfg 门后面的东西，
      # Windows 和 macOS 的作业根本不会编译它们。
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked --jobs 1

      # 打包清单是会过期的东西：manifest 里的 runtime 版本、desktop 文件的
      # 字段、AppStream 的必填元素，改错了不会让任何构建失败，只会在用户
      # 装的时候变成一个没有名字的条目。
      #
      # 这几步都是秒级的，所以在 PR 上也跑。真正的 Flatpak 构建（十几分钟）
      # 只在推 main 和打 tag 时跑，见 package-flatpak。
      - name: Validate the Flatpak metadata
        run: |
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils appstream flatpak flatpak-builder
          desktop-file-validate packaging/flatpak/com.zeppbridge.app.desktop
          appstreamcli validate --no-net --explain \
            packaging/flatpak/com.zeppbridge.app.metainfo.xml
          # manifest 本身能不能被解析、每个键是否认得。写错一个键名，
          # flatpak-builder 是静默忽略它的。
          flatpak-builder --show-manifest \
            packaging/flatpak/com.zeppbridge.app.yml > /dev/null

      # `appstreamcli validate` 只看那份 XML 自己合不合法。flatpak-builder
      # 真正跑的是 `appstreamcli compose`，那一步还要去读 desktop 文件和图标，
      # 而它是在整个 Rust 编译成功之后才跑的——一个读不了的图标会让十五分钟
      # 的构建倒在最后一步，报一句既不提文件名也不提图标的
      #   com.zeppbridge.app  E: file-read-error
      #
      # 这里用打包用的那几个文件搭一个最小的 /usr 树，把同一个 compose 提前
      # 到秒级跑掉。（这条检查就是这么发现 icon-source.svg 不能当平台图标的：
      # 它用 <symbol> + <use> 间接引用，compose 读不了。）
      - name: Dry-run the AppStream compose the Flatpak build will do
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends appstream-compose
          root=$(mktemp -d)/files
          mkdir -p "$root/usr/share/applications" "$root/usr/share/metainfo"
          install -m644 packaging/flatpak/com.zeppbridge.app.desktop \
            "$root/usr/share/applications/com.zeppbridge.app.desktop"
          install -m644 packaging/flatpak/com.zeppbridge.app.metainfo.xml \
            "$root/usr/share/metainfo/com.zeppbridge.app.metainfo.xml"

          # 图标来源要和 manifest 里的 install 命令一致，否则这条检查会
          # 检查一个和实际构建不同的东西。
          for pair in 32x32:32x32 64x64:64x64 128x128:128x128 \
                      128x128@2x:256x256 icon:512x512; do
            src="${pair%%:*}"; dir="${pair##*:}"
            mkdir -p "$root/usr/share/icons/hicolor/$dir/apps"
            install -m644 "src-tauri/icons/$src.png" \
              "$root/usr/share/icons/hicolor/$dir/apps/com.zeppbridge.app.png"
          done

          out=$(mktemp -d)
          appstreamcli compose --origin=ci --prefix=/usr \
            --result-root="$out" --data-dir="$out/data" --icons-dir="$out/icons" \
            --components=com.zeppbridge.app "$root"

      # 钉住的 runtime 会在某一天停止维护，而那一天不会有任何东西提醒我们：
      # 构建照样绿，装出来的应用照样能跑，只是它内嵌的 WebView 不再收到
      # 安全更新了。这个项目上，WebView 是暴露面最大的那个组件。
      #
      # 这一步就是把那一天变成一次 CI 失败。Tauri 自己的 Flatpak 文档到现在
      # 还写着 GNOME 47——那个版本 2025 年 10 月就 EOL 了。
      - name: Check the pinned Flatpak runtime is still supported
        run: |
          set -euo pipefail
          version=$(sed -n "s/^runtime-version: *'\{0,1\}\([^']*\)'\{0,1\}$/\1/p" \
            packaging/flatpak/com.zeppbridge.app.yml)
          : "${version:?could not read runtime-version from the manifest}"
          echo "manifest pins org.gnome.Platform//$version"

          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          info=$(flatpak remote-info --user flathub "org.gnome.Platform//$version")
          echo "$info"

          if grep -qi 'End-of-life' <<< "$info"; then
            echo "::error::org.gnome.Platform//$version 已经 EOL，不再收到安全更新。"
            echo "::error::请在 packaging/flatpak/com.zeppbridge.app.yml 里升 runtime-version，"
            echo "::error::并确认新 runtime 仍然带 webkit2gtk-4.1（Tauri 2 需要 GTK3 那一版）："
            echo "::error::  flatpak install --user org.gnome.Platform//<新版本>"
            echo "::error::  find ~/.local/share/flatpak/runtime/org.gnome.Platform/x86_64/<新版本>/active/files -name 'libwebkit2gtk-4.1.so*'"
            exit 1
          fi
          echo "runtime is still supported"

      # 托盘那三个模块的来源。
      #
      # 真正的 Flatpak 构建只在推 main 和打 tag 时跑，所以这三个模块写错了，
      # PR 上是绿的、合并之后 main 才红。这一步把最容易出错、也最容易静默
      # 出错的那部分提前到秒级：URL 还在不在、tarball 的校验值对不对、两个
      # git tag 还指不指着钉住的那个 commit。
      #
      # 它不构建任何东西。构建成不成立仍然由 package-flatpak 回答。
      - name: Check the tray indicator modules can still be fetched
        run: |
          set -euo pipefail
          manifest=packaging/flatpak/com.zeppbridge.app.yml
          python3 - "$manifest" <<'PY'
          import hashlib, subprocess, sys, urllib.request, yaml

          manifest = yaml.safe_load(open(sys.argv[1], encoding="utf-8"))
          failed = []
          for module in manifest["modules"]:
              if module["name"] == "zeppbridge":
                  continue
              for source in module.get("sources", []):
                  if source["type"] == "archive":
                      url = source["url"]
                      print(f"{module['name']}: fetching {url}")
                      blob = urllib.request.urlopen(url, timeout=120).read()
                      got = hashlib.sha256(blob).hexdigest()
                      if got != source["sha256"]:
                          failed.append(
                              f"{module['name']}: sha256 {got} != manifest {source['sha256']}"
                          )
                      else:
                          print(f"  sha256 ok ({len(blob)} bytes)")
                  elif source["type"] == "git":
                      url, tag, commit = source["url"], source["tag"], source["commit"]
                      print(f"{module['name']}: git ls-remote {url} tags/{tag}")
                      out = subprocess.run(
                          ["git", "ls-remote", url, f"refs/tags/{tag}^{{}}", f"refs/tags/{tag}"],
                          check=True, capture_output=True, text=True,
                      ).stdout
                      # 附注标签有两行：`refs/tags/X` 是标签对象，`refs/tags/X^{}`
                      # 是它指向的 commit。要比对的是后者。
                      shas = {line.split("\t")[1]: line.split("\t")[0] for line in out.strip().splitlines()}
                      resolved = shas.get(f"refs/tags/{tag}^{{}}") or shas.get(f"refs/tags/{tag}")
                      if resolved != commit:
                          failed.append(
                              f"{module['name']}: tag {tag} 现在指向 {resolved}，manifest 钉的是 {commit}"
                          )
                      else:
                          print(f"  commit ok ({commit})")

          if failed:
              for line in failed:
                  print(f"::error::{line}")
              sys.exit(1)
          print("每个托盘模块的来源都还在，校验值也对得上")
          PY

  verify-macos:
    name: macOS verification
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      # tauri-build resolves frontendDist (../dist) at compile time, so the
      # frontend must exist before any cargo command runs.
      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --locked --all-targets

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --locked --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked --jobs 1

  package:
    name: Package Windows installers
    runs-on: windows-latest
    timeout-minutes: 45
    # Package on pushes to main / release tags and manual dispatch, not on PRs.
    if: github.event_name != 'pull_request'
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and bundle (NSIS + MSI)
        # beforeBuildCommand (icons:generate + vite build) runs as part of this.
        #
        # 重试三次，因为 NSIS 打包这一步要现从 GitHub 下载 nsis-3.11.zip 和
        # nsis_tauri_utils.dll。那两个下载是网络操作，会被对端重置——
        # 见 run 33368661745：Rust 编译成功（6m22s，exe 已产出），随后倒在
        #   `failed to bundle project: io: An existing connection was
        #    forcibly closed by the remote host. (os error 10054)`
        # 那不是代码问题，同一提交的 PR 跑是绿的。但它会让一次 23 分钟的
        # 构建整个作废，还把 main 标红，看起来像是刚合进去的改动出了事。
        #
        # 重试很便宜：cargo 的 fingerprint 还在，第二次不会重新编译，
        # 只重跑打包。真正的代码错误则三次都会失败，仍然照常报红。
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "== tauri build attempt $i/$attempts =="
            npm run tauri build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -lt $attempts) {
              Write-Host "attempt $i failed (exit $LASTEXITCODE); retrying in 20s"
              Start-Sleep -Seconds 20
            }
          }
          Write-Error "tauri build failed after $attempts attempts"
          exit 1

      # latest.json 的 notes 就是应用内更新弹窗展示给用户的说明，硬编码会
      # 让每次发版都显示上一版的内容。发布 tag 时取该 tag 的注释首行。
      - name: Resolve release notes from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          # 浅克隆只取到 tag 指向的 commit，附注对象不在本地；不显式拉取的话
          # `%(contents:subject)` 会静默回退成 commit 标题，把「fix(site): ...」
          # 这种工程日志当成更新说明推给用户。
          git fetch --force --no-tags origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::warning::${GITHUB_REF_NAME} 是轻量标签，没有注释消息；沿用默认说明"
            exit 0
          fi
          notes=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:subject)')
          if [[ -z "$notes" ]]; then
            echo "::warning::标签注释为空，沿用默认说明"
            exit 0
          fi
          echo "ZEPPBRIDGE_RELEASE_NOTES=${notes}" >> "$GITHUB_ENV"
          echo "更新说明：${notes}"

      - name: Collect installers into release/
        shell: pwsh
        run: ./scripts/windows/publish-local.ps1 -SkipShortcuts -SkipStaleInstall

      # CLI 与 MCP 单独分发：需要它们的人不该被迫先装一个 GUI，
      # 装了 GUI 的人也不该被塞进两个用不到的 binary。
      - name: Package CLI and MCP tools
        shell: pwsh
        run: ./scripts/release/package-tools.ps1

      - name: Upload installers
        # v4 跑在已经废弃的 Node 20 上。upload 与 download 的大版本号从 v5
        # 起就不再同步（download 多走了一版路径修复），所以这里是 v7 / v8，
        # 不是同一个数字写错了。
        uses: actions/upload-artifact@v7
        with:
          name: zeppbridge-installers
          path: |
            release/ZeppBridge_*-setup.exe
            release/ZeppBridge_*.msi
            release/zeppbridge-tools-*.zip
            release/latest.json
          if-no-files-found: error
          retention-days: 14

  package-macos:
    name: Package macOS bundle
    runs-on: macos-latest
    timeout-minutes: 45
    # Package on pushes to main / release tags and manual dispatch, not on PRs.
    if: github.event_name != 'pull_request'
    needs: verify-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and bundle (app + dmg)
        # beforeBuildCommand (icons:generate + vite build) runs as part of this.
        # The bundle is ad-hoc signed: no Apple Developer ID, no notarization.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles app,dmg

      - name: Collect macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          bundle=src-tauri/target/release/bundle
          mkdir -p release-macos

          dmg=$(ls "$bundle"/dmg/*.dmg)
          cp "$dmg" "release-macos/ZeppBridge_${version}_aarch64.dmg"

          # The updater consumes the .app.tar.gz, never the dmg. A missing
          # signature would advertise an unverifiable update, so fail here
          # rather than publish a half-signed latest.json.
          cp "$bundle/macos/ZeppBridge.app.tar.gz" \
             "release-macos/ZeppBridge_${version}_aarch64.app.tar.gz"
          cp "$bundle/macos/ZeppBridge.app.tar.gz.sig" \
             "release-macos/ZeppBridge_${version}_aarch64.app.tar.gz.sig"
          ls -la release-macos

      - name: Package CLI and MCP tools
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/release/package-tools.ps1 \
            -Target aarch64-apple-darwin
          mv release/zeppbridge-tools-*.zip release-macos/

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v7
        with:
          name: zeppbridge-macos
          path: release-macos/*
          if-no-files-found: error
          retention-days: 14

  package-linux:
    name: Package Linux bundles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Package on pushes to main / release tags and manual dispatch, not on PRs.
    if: github.event_name != 'pull_request'
    needs: verify-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      # deb/rpm/appimage 三样都出。三种发行版家族，不要求用户去转换包格式。
      #
      # `--config src-tauri/tauri.linux.conf.json` 把 createUpdaterArtifacts
      # 关掉。基础配置里它是 true（Windows 和 macOS 要用），而那个开关是全局
      # 的：开着的时候 tauri 会去找签名私钥，找不到就直接失败——
      #   `A public key has been found, but no private key.`
      # 而 Linux 这边刻意不产出 updater 产物：latest.json 里没有 linux 条目，
      # 应用内更新在 Linux 上是关掉的（updates.rs 的 self_update_supported），
      # 签一份没人会去取的产物只是白签。这个作业因此也不需要拿到那个 secret。
      - name: Build and bundle (deb + rpm + appimage)
        # appimagetool 要用 FUSE 挂载自己，CI runner 上没有。
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          npm run tauri build -- \
            --config src-tauri/tauri.linux.conf.json \
            --bundles deb,rpm,appimage

      - name: Collect Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          bundle=src-tauri/target/release/bundle
          mkdir -p release-linux

          # tauri 给出的文件名在不同版本间变过（`_amd64` / `_x86_64`、rpm 那边
          # 还带一个 release 号：ZeppBridge-1.1.5-1.x86_64.rpm）。用通配拿到
          # 文件再自己命名，发布产物的名字才不会随工具链漂移。
          #
          # 恰好一个匹配才算数。零个意味着打包静默地没产出这一种格式；两个
          # 意味着上一次构建的残留还在，而那时 cp 会随机挑一个——发布出去的
          # 就可能是个旧版本的包，且没有任何迹象。
          # nullglob 是必须的：默认情况下不匹配的通配会原样留下，于是
          # `matches` 里是那一段字面的模式字符串，计数报「1 个」。真正拦住它
          # 的是下面的 -f 检查，但报错会指着一个看起来存在的文件名，读的人
          # 得先怀疑自己。
          shopt -s nullglob

          take_one() {
            local pattern="$1" dest="$2"
            local matches=()
            # shellcheck disable=SC2206
            matches=($pattern)
            if [[ ${#matches[@]} -ne 1 || ! -f "${matches[0]}" ]]; then
              echo "::error::期望 $pattern 恰好匹配一个文件，实际 ${#matches[@]} 个：${matches[*]-}"
              exit 1
            fi
            cp "${matches[0]}" "$dest"
            echo "  ${matches[0]}  ->  $dest"
          }

          take_one "$bundle/deb/*.deb"           "release-linux/ZeppBridge_${version}_amd64.deb"
          take_one "$bundle/rpm/*.rpm"           "release-linux/ZeppBridge_${version}_x86_64.rpm"
          take_one "$bundle/appimage/*.AppImage" "release-linux/ZeppBridge_${version}_x86_64.AppImage"

      - name: Package CLI and MCP tools
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/release/package-tools.ps1 \
            -Target x86_64-unknown-linux-gnu
          mv release/zeppbridge-tools-*.zip release-linux/

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v7
        with:
          name: zeppbridge-linux
          path: release-linux/*
          if-no-files-found: error
          retention-days: 14

  package-flatpak:
    name: Package Flatpak bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'pull_request'
    needs: verify-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install flatpak-builder
        # elfutils 提供 eu-strip。flatpak-builder 默认会把调试信息从二进制里
        # 剥出来单独放，那一步就是调 eu-strip；缺了它，整个构建会在**编译全部
        # 成功之后**才失败：
        #   Failed to execute child process "eu-strip" (No such file or directory)
        # ubuntu-latest 上没有预装它。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils

      - name: Build and export the bundle
        # --bundle 会写 release/ZeppBridge_<version>_x86_64.flatpak；
        # --no-install 是因为 CI 上没人要运行它，装一遍只是浪费几分钟。
        run: ./packaging/flatpak/build-flatpak.sh --bundle --no-install

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: zeppbridge-flatpak
          path: release/ZeppBridge_*.flatpak
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 这个作业在 PR 上也跑。它是唯一一处会在 Linux 上真的把 CLI 和 MCP
    # 编译出来并运行一次的地方，而 Dockerfile 本身也是会坏的东西——
    # 一次 COPY 写漏了，只有构建镜像时才看得出来。
    needs: verify-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build the headless image
        run: docker build -f packaging/docker/Dockerfile -t zeppbridge:ci .

      # 一个只读、不联网的自检：镜像跑得起来，数据目录落在挂载的卷上，
      # 没连账号时给出的是约定好的退出码 3（而不是崩掉或者退 1）。
      - name: Smoke-test the headless image
        run: |
          set -euo pipefail
          docker run --rm zeppbridge:ci zeppbridge-cli version
          docker run --rm zeppbridge:ci zeppbridge-cli contract > /dev/null

          set +e
          out=$(docker run --rm --network none -v zeppbridge-ci-data:/data zeppbridge:ci)
          code=$?
          set -e
          echo "$out"
          if [[ "$code" -ne 3 ]]; then
            echo "::error::空数据库上 status 应当退 3（未连接账号），实际 $code"
            exit 1
          fi

          # 数据目录必须是挂进来的卷。落在镜像层里的话，容器一删数据就没了,
          # 而这一步在 CI 上看起来仍然是绿的。
          docker run --rm -v zeppbridge-ci-data:/data zeppbridge:ci \
            sh -c 'test "$ZEPPBRIDGE_DATA_DIR" = /data && test -w /data'

      - name: Build the toolchain image
        run: docker build -f packaging/docker/Dockerfile.build -t zeppbridge-build:ci .

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only on release tags (v*), and only once both platforms packaged.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, package-macos, package-linux, package-flatpak]
    permissions:
      contents: write
      # attestation 需要这两项：id-token 用于向 Sigstore 取短期证书，
      # attestations 用于把签好的来源声明写回仓库。
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The tag annotation is the release body, and a depth-1 checkout does
          # not bring the tag object with it.
          fetch-depth: 0

      - name: Download Windows installers
        # download v8 起，摘要对不上默认是**报错**而不是警告（`digest-mismatch`）。
        # 这条路径上宁可发布失败，也不该把一个下载途中损坏的安装包发出去。
        uses: actions/download-artifact@v8
        with:
          name: zeppbridge-installers
          path: release

      - name: Download macOS bundle
        uses: actions/download-artifact@v8
        with:
          name: zeppbridge-macos
          path: release-macos

      - name: Download Linux bundles
        uses: actions/download-artifact@v8
        with:
          name: zeppbridge-linux
          path: release-linux

      - name: Download Flatpak bundle
        uses: actions/download-artifact@v8
        with:
          name: zeppbridge-flatpak
          path: release-linux

      - name: Merge updater metadata for both platforms
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          node scripts/release/merge-latest-json.mjs \
            --windows-latest release/latest.json \
            --mac-signature "release-macos/ZeppBridge_${version}_aarch64.app.tar.gz.sig" \
            --mac-asset "ZeppBridge_${version}_aarch64.app.tar.gz" \
            --version "$version" \
            --repo "${GITHUB_REPOSITORY}" \
            --out release/latest.json
          cat release/latest.json

      # 发版说明取附注标签的正文。`--generate-notes` 给的是 commit 列表，
      # 那是工程日志不是更新说明——读者要知道这版能多做什么，不是有哪些
      # commit。轻量标签没有正文，那时才回退到自动生成。
      - name: Resolve release body from tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::warning::${GITHUB_REF_NAME} 是轻量标签，发版说明回退为自动生成"
            echo "RELEASE_BODY_MODE=generate" >> "$GITHUB_ENV"
            exit 0
          fi
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' \
            > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::warning::标签正文为空，发版说明回退为自动生成"
            echo "RELEASE_BODY_MODE=generate" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "RELEASE_BODY_MODE=file" >> "$GITHUB_ENV"
          cat release-notes.md

      # 一份覆盖全部发布产物的校验和清单。用户可以逐个核对，
      # 而不必相信「下载页看起来没问题」。
      - name: Generate checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          : > SHA256SUMS.txt
          for file in release/ZeppBridge_*-setup.exe release/ZeppBridge_*.msi \
                      release/zeppbridge-tools-*.zip release-macos/zeppbridge-tools-*.zip \
                      release-linux/zeppbridge-tools-*.zip \
                      "release-macos/ZeppBridge_${version}_aarch64.dmg" \
                      "release-macos/ZeppBridge_${version}_aarch64.app.tar.gz" \
                      release-linux/ZeppBridge_*.deb \
                      release-linux/ZeppBridge_*.rpm \
                      release-linux/ZeppBridge_*.AppImage \
                      release-linux/ZeppBridge_*.flatpak \
                      release/latest.json; do
            sha256sum "$file" | sed "s#[^ ]*/##" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      # 构建来源声明：证明这些文件确实由本仓库这条 workflow 产出。
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/ZeppBridge_*-setup.exe
            release/ZeppBridge_*.msi
            release/zeppbridge-tools-*.zip
            release-macos/zeppbridge-tools-*.zip
            release-macos/ZeppBridge_*.dmg
            release-macos/ZeppBridge_*.app.tar.gz
            release-linux/zeppbridge-tools-*.zip
            release-linux/ZeppBridge_*.deb
            release-linux/ZeppBridge_*.rpm
            release-linux/ZeppBridge_*.AppImage
            release-linux/ZeppBridge_*.flatpak

      - name: Publish GitHub Release
        # Idempotent: skips if the release already exists.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists, skipping publish"
            exit 0
          fi
          if [[ "${RELEASE_BODY_MODE}" == "file" ]]; then
            notes_args=(--notes-file release-notes.md)
          else
            notes_args=(--generate-notes)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            release/ZeppBridge_*-setup.exe \
            release/ZeppBridge_*.msi \
            release/zeppbridge-tools-*.zip \
            release-macos/zeppbridge-tools-*.zip \
            release-linux/zeppbridge-tools-*.zip \
            "release-macos/ZeppBridge_${version}_aarch64.dmg" \
            "release-macos/ZeppBridge_${version}_aarch64.app.tar.gz" \
            release-linux/ZeppBridge_*.deb \
            release-linux/ZeppBridge_*.rpm \
            release-linux/ZeppBridge_*.AppImage \
            release-linux/ZeppBridge_*.flatpak \
            release/latest.json \
            SHA256SUMS.txt \
            --title "ZeppBridge ${version}" \
            "${notes_args[@]}"

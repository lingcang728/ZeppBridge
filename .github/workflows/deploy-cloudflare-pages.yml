name: Deploy website to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare website capture tools
        run: |
          python -c "import playwright" || python -m pip install playwright==1.58.0
          python -m playwright install chromium --with-deps
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Restore captured application journeys
        uses: actions/cache@v4
        with:
          path: .site-cache/media
          key: landing-media-${{ runner.os }}-${{ hashFiles('src/**', 'scripts/site/capture-features.py') }}
          restore-keys: landing-media-${{ runner.os }}-

      - name: Build landing page and current application demos
        run: npm ci && npm run test:functions && npm run build:web

      - name: Apply feedback database migrations
        if: env.CLOUDFLARE_D1_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply zeppbridge-feedback --remote

      - name: Report externally managed database migrations
        if: env.CLOUDFLARE_D1_API_TOKEN == ''
        run: echo "::notice::D1 migrations are managed by an authorized Wrangler session; Pages deployment will continue."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .site-cache/site-dist --project-name=zeppbridge --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

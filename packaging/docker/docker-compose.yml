# Scheduled sync for a machine that is already on — a NAS, a home server, a VPS.
#
# Run from the repository root:
#   docker compose -f packaging/docker/docker-compose.yml run --rm sync
#
# Nothing here starts on `docker compose up`. Every service is behind a profile,
# and all but `serve` (the optional read-only REST API at the bottom) are one-shot
# commands: the CLI syncs and exits. What schedules sync is the host — cron, a
# systemd timer, the NAS task scheduler. Putting cron inside the container
# would mean a second init system, its own log destination, and a container
# that looks healthy while doing nothing. See docs/guides/docker.md for the timer.

x-common: &common
  image: zeppbridge:local
  build:
    context: ../..
    dockerfile: packaging/docker/Dockerfile
  # The uid that owns ./data on the host. Set ZEPPBRIDGE_UID/GID in a .env file
  # next to this one, or export them; 1000:1000 is the common desktop default.
  user: "${ZEPPBRIDGE_UID:-1000}:${ZEPPBRIDGE_GID:-1000}"
  volumes:
    # The whole library: zepp.db, auth.json, exports/, backups/.
    - ./data:/data
  environment:
    ZEPPBRIDGE_DATA_DIR: /data
    # The App Token, from the desktop app's credential store. Keep it in a .env
    # file (or a real secret) rather than inline here — a compose file gets
    # committed, and `docker inspect` shows environment values to anyone who can
    # reach the daemon.
    ZEPPBRIDGE_APP_TOKEN: "${ZEPPBRIDGE_APP_TOKEN:-}"
    ZEPPBRIDGE_CREDENTIAL_STORE: env
    # Local days are local. Without this the container is UTC and a reading
    # taken at 00:30 lands on the previous day.
    TZ: "${TZ:-UTC}"
  restart: "no"

services:
  # Incremental sync: only what changed since the last run. This is the one to
  # put on a timer.
  sync:
    <<: *common
    profiles: ["sync"]
    command: ["zeppbridge-cli", "sync", "--mode", "incremental", "--json"]

  # What is in the library right now, and how far back it goes.
  status:
    <<: *common
    profiles: ["status"]
    command: ["zeppbridge-cli", "status", "--json"]

  # The MCP server. Listed for completeness, but note it speaks stdio
  # and listens on no port, so it is not a service you leave running — the MCP
  # client spawns it. `docker compose run --rm -T mcp` is the shape that works;
  # docs/guides/docker.md has the client config.
  mcp:
    <<: *common
    profiles: ["mcp"]
    command: ["zeppbridge-mcp"]
    stdin_open: true
    tty: false

  # The read-only REST API for a self-hosted service that pulls from it
  # (SparkyFitness, Home Assistant). Unlike the services above this one stays
  # up: `docker compose --profile serve up -d`.
  #
  # There is deliberately no `ports:`. The API is plain HTTP, so it is reachable
  # only from containers on the internal network below; put the service that
  # pulls on that same network. Reaching it from another machine means an HTTPS
  # reverse proxy in front, not a published port. serve refuses to listen beyond
  # loopback without a pull token. GPS tracks are only returned when a request
  # asks for include_gps=true. Contract: docs/guides/self-hosted-pull.md.
  serve:
    <<: *common
    profiles: ["serve"]
    command: ["zeppbridge-cli", "serve"]
    restart: unless-stopped
    environment:
      ZEPPBRIDGE_DATA_DIR: /data
      ZEPPBRIDGE_CREDENTIAL_STORE: env
      TZ: "${TZ:-UTC}"
      # Listen inside the container network. Without this, serve listens on
      # 127.0.0.1 only, which no other container can reach.
      ZEPPBRIDGE_LISTEN: "0.0.0.0:43921"
      # At least 32 characters, e.g. `openssl rand -base64 33`. Give the same
      # value to the service that pulls (Authorization: Bearer <token>).
      ZEPPBRIDGE_PULL_TOKEN: "${ZEPPBRIDGE_PULL_TOKEN:-}"
    networks: [zeppbridge-internal]
    # Another service in this file (or in your SparkyFitness compose, joined to
    # this network) reaches it as http://serve:43921/v1/records.
    #
    # sparkyfitness-server:
    #   networks: [zeppbridge-internal, default]

networks:
  # internal: no route out of it and nothing published from it.
  zeppbridge-internal:
    internal: true
